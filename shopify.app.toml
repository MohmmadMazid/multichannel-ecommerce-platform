# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c4e9967c0db6a4bcddb5042152f644d1"
name = "MultiChannel Commerce"
application_url = "https://multichannel-commerce-hoee.onrender.com"
embedded = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/api/integrations/shopify/webhooks"
  topics = [
  "products/create",
  "inventory_levels/update",
  "products/update"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_products,write_inventory,write_products"
optional_scopes = [ ]

[auth]
redirect_urls = [
  "http://localhost:3000/api/integrations/shopify/callback",
  "https://multichannel-commerce-hoee.onrender.com/api/integrations/shopify/callback"
]
